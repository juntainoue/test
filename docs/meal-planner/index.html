<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#1d5140" />
    <meta
      name="description"
      content="食べたい料理を選ぶと、食材を使い回す数日分の夕食と買い物リストをつくる、一人暮らし向けの献立アプリ。"
    />
    <title>ごはん計画 | 献立と買い物</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="wrap brand">
        <span class="logo">🍳</span>
        <h1>ごはん計画</h1>
      </div>
    </header>
    <main class="main wrap">
      <nav class="tabs" aria-label="画面切り替え">
        <button class="tab active" data-tab="usekiri">🧺 使い切り計画</button
        ><button class="tab" data-tab="recipes">📖 レシピ</button>
      </nav>
      <section id="page-usekiri" aria-labelledby="ukTitle">
        <div class="card">
          <div class="uk-head">
            <h2 id="ukTitle" class="uk-title">何を食べる？</h2>
            <label class="uk-days"
              ><select id="ukDays" aria-label="日数">
                <option value="1">1日分</option>
                <option value="2">2日分</option>
                <option value="3" selected>3日分</option>
                <option value="4">4日分</option>
                <option value="5">5日分</option>
                <option value="6">6日分</option>
                <option value="7">7日分</option>
              </select></label
            >
          </div>
          <div id="ukDishGrid" class="uk-dish-grid"></div>
          <button id="ukMoreDishes" class="btn ghost uk-more" type="button" hidden>
            もっと見る
          </button>
          <details class="uk-opts">
            <summary>こだわり条件</summary>
            <div class="settings uk-conditions">
              <label
                >調理時間<select id="ukTime">
                  <option value="">指定なし</option>
                  <option value="15">15分以内</option>
                  <option value="20">20分以内</option>
                  <option value="30">30分以内</option>
                  <option value="45">45分以内</option>
                </select></label
              ><label
                >冷凍<select id="ukFreeze">
                  <option value="yes">できる</option>
                  <option value="no">できない</option>
                </select></label
              ><label
                >作り置き<select id="ukMakeAhead">
                  <option value="no">しない</option>
                  <option value="yes">する</option>
                </select></label
              ><label
                >同じ料理<select id="ukRepeat">
                  <option value="no">続けない</option>
                  <option value="yes">続けてもいい</option>
                </select></label
              >
            </div>
          </details>
          <details class="uk-opts" id="ukPantryBox">
            <summary>家にある食材を使う</summary>
            <div class="uk-pantry-add">
              <input
                id="ukPantryInput"
                class="search"
                type="text"
                placeholder="例：キャベツ"
                aria-label="家にある食材"
              /><button id="ukPantryAdd" class="btn secondary" type="button">追加</button>
            </div>
            <p id="ukPantrySuggest" class="small muted" role="status"></p>
            <ul id="ukPantryList" class="uk-pantry"></ul>
          </details>
          <p id="ukMessage" class="info" role="status" aria-live="polite"></p>
          <div hidden>
            <button id="ukAi" type="button">AI</button>
            <p id="ukAiMessage" role="status"></p>
            <ul id="ukAiRejected"></ul>
          </div>
        </div>
        <div class="card" id="ukPlanCard">
          <div class="sectionhead">
            <h2>献立</h2>
            <button id="ukRegenerate" class="btn ghost" type="button">作り直す</button>
          </div>
          <div id="ukWarnings" class="uk-warnings" role="status"></div>
          <ol id="ukPlan" class="uk-plan"></ol>
        </div>
        <div class="card" id="ukShopCard">
          <div class="sectionhead">
            <h2>買い物</h2>
            <button id="ukCopy" class="btn secondary" type="button">コピー</button>
          </div>
          <div id="ukShop" class="uk-shop"></div>
          <div class="actions">
            <button id="ukReplan" class="btn" type="button">この量で献立を調整</button>
          </div>
          <p id="ukReplanMessage" class="info" role="status" aria-live="polite"></p>
        </div>
        <div class="card" id="ukLeftCard">
          <h2>余る食材</h2>
          <div id="ukLeftovers"></div>
        </div>
      </section>
      <section id="page-recipes" class="hidden">
        <div class="card">
          <div class="uk-head">
            <input
              id="recipeSearch"
              class="search"
              type="search"
              placeholder="料理名・食材"
              aria-label="料理名や食材で探す"
            />
            <label class="favorite-filter"
              ><input id="favoritesOnly" type="checkbox" /> ♥のみ</label
            >
          </div>
          <div id="recipeGrid" class="recipes"></div>
        </div>
      </section>
      <footer class="footer">
        写真はAI生成のイメージです（副菜は献立に含みません）。栄養値は未検証の目安です。アレルギーや食材の状態はご自身で確認してください。データはこの端末にだけ保存されます。
      </footer>
    </main>
    <dialog id="detail">
      <div class="dialog-body">
        <div class="sectionhead">
          <h2 id="detailTitle"></h2>
          <button id="closeDetail" class="btn ghost" aria-label="閉じる">
            閉じる
          </button>
        </div>
        <div id="detailImage"></div>
        <p id="detailMeta" class="muted"></p>
        <h3>材料（<span id="detailServings"></span>人分）</h3>
        <ul id="detailIngredients"></ul>
        <h3>作り方</h3>
        <ol id="detailSteps"></ol>
        <p class="small muted">
          加熱時間は目安です。火の通りを確かめてください。<span id="detailCheck"></span>
        </p>
        <h3>保存</h3>
        <p id="detailStorage"></p>
      </div>
    </dialog>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
